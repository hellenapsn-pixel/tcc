
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Entrar - Inventory</title>
<link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(168, 85, 247, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(124, 58, 237, 0.2),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #09060d,
                    #160d20,
                    #0b0710
                );

            overflow-x: hidden;
        }.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-header {
    width: 42px;
    height: 42px;
    object-fit: contain;
    display: block;
}

.logo-area h1 {
    margin: 0;
}
        

        /* =========================================
           CONTAINER
        ========================================= */

        .login-page {
            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        /* =========================================
           CARD
        ========================================= */

        .login-card {
            width: 100%;
            max-width: 450px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 22, 48, 0.97),
                    rgba(18, 11, 25, 0.98)
                );

            border: 1px solid rgba(168, 85, 247, 0.3);

            border-radius: 22px;

            padding: 38px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(124, 58, 237, 0.08);

            position: relative;

            overflow: hidden;

            animation: aparecer 0.5s ease;
        }

        .login-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background: #9333ea;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.12;

            top: -80px;
            right: -50px;
        }

        .login-card::after {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            background: #7c3aed;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.09;

            bottom: -70px;
            left: -50px;
        }

        /* =========================================
           LOGO
        ========================================= */

        .login-logo {
            text-align: center;

            margin-bottom: 10px;

            font-family: 'Orbitron', sans-serif;

            font-size: 34px;

            font-weight: 700;

            letter-spacing: 2px;

            background:
                linear-gradient(
                    90deg,
                    #c084fc,
                    #a855f7,
                    #7c3aed
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            text-align: center;

            color: #9d92a7;

            font-size: 15px;

            margin-bottom: 30px;
        }

        /* =========================================
           TÍTULO
        ========================================= */

        .login-card h2 {
            text-align: center;

            font-family: 'Orbitron', sans-serif;

            font-size: 24px;

            margin-bottom: 28px;

            color: white;
        }

        /* =========================================
           CAMPOS
        ========================================= */

        .campo-login {
            margin-bottom: 18px;
        }

        .campo-login label {
            display: block;

            margin-bottom: 7px;

            color: #ddd;

            font-weight: 600;

            font-size: 14px;
        }

        .campo-login input {
            width: 100%;

            padding: 14px 15px;

            background: #0e0a13;

            border: 1px solid #3b2a49;

            border-radius: 10px;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }

        .campo-login input:focus {
            border-color: #a855f7;

            box-shadow:
                0 0 0 3px
                rgba(168, 85, 247, 0.12);
        }

        /* =========================================
           BOTÃO ENTRAR
        ========================================= */

        .botao-entrar {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            color: white;

            font-family: 'Orbitron', sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }

        .botao-entrar:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(124, 58, 237, 0.35);

            background:
                linear-gradient(
                    135deg,
                    #9333ea,
                    #c084fc
                );
        }

        /* =========================================
           DIVISOR
        ========================================= */

        .divisor {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color: #756a7e;

            font-size: 13px;
        }

        .divisor::before,
        .divisor::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #33263d;
        }

        /* =========================================
           GOOGLE
        ========================================= */

        .botao-google {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 13px;

            border-radius: 10px;

            background: #ffffff;

            color: #202124;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            border: 1px solid #ddd;

            transition: 0.25s;
        }

        .botao-google:hover {
            background: #f4f4f4;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.2);
        }

        .google-icon {
            width: 20px;
            height: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        /* =========================================
           CADASTRO
        ========================================= */

        .cadastro-link {
            text-align: center;

            margin-top: 25px;

            color: #92879c;

            font-size: 14px;
        }

        .cadastro-link a {
            color: #c084fc;

            font-weight: bold;

            text-decoration: none;
        }

        .cadastro-link a:hover {
            color: white;
        }

        /* =========================================
           VOLTAR
        ========================================= */

        .voltar {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #746a7d;

            text-decoration: none;

            font-size: 13px;
        }

        .voltar:hover {
            color: #c084fc;
        }

        /* =========================================
           ANIMAÇÃO
        ========================================= */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .login-page {
                padding: 25px 12px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .login-logo {
                font-size: 29px;
            }

            .login-card h2 {
                font-size: 21px;
            }

        }

    </style>

</head>

<body>

<header>

        <div class="logo-area">
    <img src="icon.png" alt="Logo Inventory" class="logo-header">
    <h1>Inventory</h1>
</div>

    <nav>

        <a href="index.html">
            Início
        </a>

        <a href="jogos">
            Jogos
        </a>

        <a href="biblioteca">
            Biblioteca
        </a>

        <a href="buscar-usuarios.html">
            Buscar usuários
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<main class="login-page">

    <section class="login-card">

        <div class="login-logo">
            INVENTORY
        </div>

        <p class="login-subtitle">
            Sua biblioteca. Seus jogos. Sua história.
        </p>

        <h2>
            Entrar na sua conta
        </h2>


        <!-- LOGIN NORMAL -->

        <form
            action="login"
            method="POST"
        >

            <div class="campo-login">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="campo-login">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="botao-entrar"
            >
                ENTRAR
            </button>

        </form>


        <!-- DIVISOR -->

        <div class="divisor">
            ou
        </div>


        <!-- GOOGLE -->

        <a
            href="google-login"
            class="botao-google"
        >

            <span class="google-icon">
                G
            </span>

            Entrar com Google

        </a>


        <!-- CADASTRO -->

        <p class="cadastro-link">

            Ainda não tem uma conta?

            <a href="cadastro.html">
                Criar conta
            </a>

        </p>


        <a
            href="index.html"
            class="voltar"
        >
            ← Voltar para o início
        </a>

    </section>

</main>

</body>

</html>
